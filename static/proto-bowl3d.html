<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>그릇 3D 시안</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 30%, #3a2416, #120a06 70%); color: #f3e6d4; font-family: system-ui, sans-serif; }
  #stage { width: 100%; height: 78vh; }
  .bar { display: flex; gap: 8px; justify-content: center; padding: 10px; flex-wrap: wrap; }
  button { background: #2a1a10; color: #f3e6d4; border: 1px solid #f3a952; border-radius: 999px; padding: 8px 14px; font-size: 15px; }
</style></head>
<body>
<div id="stage"></div>
<div class="bar">
  <button data-k="kimchi">배추김치 한 집게</button><button data-k="pork">돼지고기</button><button data-k="tofu">두부</button>
  <button data-k="onion">양파</button><button data-k="scallion">대파</button>
</div>
<script type="module">
  import { createBowl3D } from './js/bowl3d.js';
  const b = createBowl3D(document.getElementById('stage'), { capture: true, noSoup: location.search.includes('nosoup') });
  window.bowl = b;
  let f = 0.15; b.setFill(f);
  for (const btn of document.querySelectorAll('button')) btn.onclick = () => { const k = btn.dataset.k; b.drop(k, k === 'scallion' ? 8 : k === 'tofu' ? 2 : 3); f = Math.min(1, f + 0.06); b.setFill(f); };
</script>
</body></html>
